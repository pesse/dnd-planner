name: Build

# Frontend-Build auf demselben Runner und mit denselben Actions wie release.yml, von Hand
# gestartet (`gh workflow run build.yml`) — prüft vor einem Release, ob der Build durchgeht.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
