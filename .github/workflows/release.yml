name: Release

# Baut & signiert ein Windows-Release und hängt Installer + latest.json an ein
# in GitHub veröffentlichtes Release. Auslöser: ein Release wird publiziert.
# Die Release-Beschreibung (UI) landet im notes-Feld von latest.json (Update-Dialog).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Genau den getaggten Stand des Releases bauen.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign & attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # An das bestehende, ausgelöste Release hängen (statt ein neues anzulegen).
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          # Beschreibung aus dem GitHub-Release → notes-Feld in latest.json.
          releaseBody: ${{ github.event.release.body }}
          # latest.json wird standardmäßig erzeugt und hochgeladen (includeUpdaterJson).
